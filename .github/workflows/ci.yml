# CI — barra regressões antes do deploy (Render/Vercel).
# Backend: typecheck (tsc --noEmit) + smoke e2e (sobe o server com
# mongodb-memory-server, sem serviços externos). Frontend: build (tsc + vite).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix backend install
      - run: npm --prefix backend run typecheck
      - run: npm --prefix backend run smoke

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix frontend install
      - run: npm --prefix frontend run build
